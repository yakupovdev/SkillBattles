spring:
  application:
    name: skillbattles
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillbattles}
    username: ${DB_USERNAME:skillbattles}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:skillbattles}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
springdoc:
  swagger-ui:
    persist-authorization: false
