spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: skillbattles
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillbattles}
    username: ${DB_USERNAME:skillbattles}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.java_time_use_direct_jdbc: true
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
# Constraint errors can include personal friend-code values. The global handler
# records exception classes without SQL parameters; expected allocation collisions retry.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  password-reset:
    ttl: ${PASSWORD_RESET_TTL:PT20M}
    base-url: ${PASSWORD_RESET_BASE_URL:}
    from: ${MAIL_FROM:}
  billing:
    mode: ${BILLING_MODE:TEST}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    monthly-price: ${STRIPE_PRICE_PRO_MONTHLY:}
    annual-price: ${STRIPE_PRICE_PRO_ANNUAL:}
    success-url: ${BILLING_SUCCESS_URL:}
    cancel-url: ${BILLING_CANCEL_URL:}
    portal-return-url: ${BILLING_PORTAL_RETURN_URL:}
    expiry-scan-ms: 1000
  season:
    scan-ms: ${SEASON_SCAN_MS:60000}
    scheduling:
      enabled: ${SEASON_SCHEDULING_ENABLED:true}
  matchmaking:
    search-seconds: ${MATCHMAKING_SEARCH_SECONDS:90}
    duel-seconds: ${PRIVATE_DUEL_SECONDS:600}
  realtime:
    heartbeat-ms: 5000
    read-timeout-ms: 10000
    connect-timeout-ms: 10000
    monitor-ms: 500
  battle:
    ready-timeout-seconds: ${READY_TIMEOUT_SECONDS:30}
    countdown-seconds: ${COUNTDOWN_SECONDS:3}
    reveal-seconds: ${REVEAL_SECONDS:5}
    reconnect-grace-seconds: ${RECONNECT_GRACE_SECONDS:30}
    question-history-battles: ${QUESTION_HISTORY_BATTLES:5}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:skillbattles}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
springdoc:
  swagger-ui:
    persist-authorization: false
