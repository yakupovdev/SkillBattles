spring:
  application:
    name: skillbattles
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillbattles}
    username: ${DB_USERNAME:skillbattles}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.java_time_use_direct_jdbc: true
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  realtime:
    heartbeat-ms: 5000
    read-timeout-ms: 10000
    connect-timeout-ms: 10000
    monitor-ms: 500
  battle:
    math:
      question-count: ${MATH_QUESTION_COUNT:3}
      question-limit-seconds: ${MATH_QUESTION_LIMIT_SECONDS:95}
    english:
      question-count: ${ENGLISH_QUESTION_COUNT:4}
      question-limit-seconds: ${ENGLISH_QUESTION_LIMIT_SECONDS:70}
    ready-timeout-seconds: ${READY_TIMEOUT_SECONDS:30}
    countdown-seconds: ${COUNTDOWN_SECONDS:3}
    reveal-seconds: ${REVEAL_SECONDS:5}
    reconnect-grace-seconds: ${RECONNECT_GRACE_SECONDS:30}
    question-history-battles: ${QUESTION_HISTORY_BATTLES:5}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:skillbattles}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
springdoc:
  swagger-ui:
    persist-authorization: false
