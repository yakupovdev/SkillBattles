spring:
  datasource:
    # Required DATABASE_URL is mapped by HerokuDatabaseEnvironmentPostProcessor.
    # Never inherit local DB_* credentials in this profile.
    url: ''
    username: ''
    password: ''
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: 10s
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
server:
  address: 0.0.0.0
  port: ${PORT}
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    threads:
      max: 40
      min-spare: 4
    max-connections: 200
    accept-count: 50
