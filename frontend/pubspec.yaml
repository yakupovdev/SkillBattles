name: skill_battles
description: "SkillBattles — live skill battles"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  material_ui: ^1.1.0
  go_router: ^18.1.4
  equatable: ^3.0.0
  flutter_svg: ^2.4.0
  dio: ^5.11.1
  json_annotation: ^4.12.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  stomp_dart_client: ^3.0.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  skeletonizer: ^3.0.0
  flutter_secure_storage: ^11.2.0
  bloc_concurrency: ^0.3.0
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.0
  lottie: ^3.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/leagues/
    - assets/stickers/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600