name: skill_battles
description: "SkillBattles — live skill battles"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  jaspr: ^0.23.5
  jaspr_router: ^0.9.0
  universal_web: ^1.1.1

  bloc_signals: ^1.7.2
  bloc_signals_jaspr: ^1.3.0
  equatable: ^3.0.0

  dio: ^5.11.1
  json_annotation: ^4.12.0
  get_it: ^9.3.0
  stomp_dart_client: ^3.0.1
  uuid: ^4.6.0
  markdown: ^7.3.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  jaspr_lints: ^0.7.2
  lints: ^5.0.0
  test: ^1.26.0
  json_serializable: ^6.15.2

# Server mode: the Jaspr server (`build/jaspr/app`) renders the document and
# the browser hydrates the app. nginx serves the static files from
# `build/jaspr/web`, proxies `/api` and `/ws` to the backend, and every other
# path to the Jaspr server.
jaspr:
  mode: server
  styles: standalone
