map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Only content-hashed files are safe to cache across deployments. Keep this
# policy on static locations so upstream API cache headers pass through intact.
map "$status:$uri" $static_cache_control {
    default "no-store";
    "~^(200|206|304):/assets/(.*/)?[^/]+\.[0-9a-f]{8}(\.[^/]+)?$" "public, max-age=31536000, immutable";
    "~^(200|206|304):" "no-cache";
}
# Extend the HTTP-level MIME map for ES modules.
types {
    application/javascript mjs;
}
# Query strings may carry a password-reset token. Never write them to access logs.
log_format app_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log app_safe;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # Only the public CA certificate is downloadable, never either private key.
    location = /local-ca.crt {
        alias /run/secrets/local_tls_ca;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="skillbattles-local-ca.crt"';
    }
    location / { return 308 https://$host:${FRONTEND_HTTPS_PORT}$request_uri; }
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/local_tls_certificate;
    ssl_certificate_key /run/secrets/local_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Static files from `jaspr build` (build/jaspr/web); everything else is
    # rendered by the Jaspr server on 127.0.0.1:3000 (see start.sh).
    root /app/web;
    access_log /var/log/nginx/access.log app_safe;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/wasm application/javascript text/javascript
               application/json application/octet-stream text/css
               image/svg+xml font/ttf font/otf;

    # Keep isolation headers in locations that also set Cache-Control.
    add_header_inherit merge;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location /media/questions/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location = /api {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location /ws/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://backend:8080;
    }
    location = /ws {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location /v3/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location /swagger-ui {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location = /main.client.dart.js {
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    location /vendor/ {
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    location /styles/ {
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    location /icons/ {
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control $static_cache_control always;
        try_files $uri @app;
    }
    # Pages (any path that is not a static file), rendered by the Jaspr server.
    location @app {
        include /etc/nginx/proxy-headers.conf;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:3000;
    }
}
