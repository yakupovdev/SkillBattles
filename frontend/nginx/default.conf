map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Extend the HTTP-level MIME map; Flutter's Wasm entrypoint is an ES module.
types {
    application/javascript mjs;
}
# Query strings may carry a password-reset token. Never write them to access logs.
log_format app_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log app_safe;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # Only the public CA certificate is downloadable, never either private key.
    location = /local-ca.crt {
        alias /run/secrets/local_tls_ca;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="skillbattles-local-ca.crt"';
    }
    location / { return 308 https://$host:${FRONTEND_HTTPS_PORT}$request_uri; }
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/local_tls_certificate;
    ssl_certificate_key /run/secrets/local_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log app_safe;

    # Keep isolation headers in locations that also set Cache-Control.
    add_header_inherit merge;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location = /api {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location /ws/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://backend:8080;
    }
    location = /ws {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location /v3/ {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location /swagger-ui {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend:8080;
    }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.mjs {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /main.dart.wasm {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; }
    location /canvaskit/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
