services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbattles}
      POSTGRES_USER: ${POSTGRES_USER:-skillbattles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillbattles}
      DB_USERNAME: ${POSTGRES_USER:-skillbattles}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-skillbattles}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      BILLING_MODE: TEST
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_ANNUAL: ${STRIPE_PRICE_PRO_ANNUAL:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-}
      BILLING_PORTAL_RETURN_URL: ${BILLING_PORTAL_RETURN_URL:-}
      SEASON_SCAN_MS: ${SEASON_SCAN_MS:-60000}
      SEASON_SCHEDULING_ENABLED: ${SEASON_SCHEDULING_ENABLED:-true}
      MATCHMAKING_SEARCH_SECONDS: ${MATCHMAKING_SEARCH_SECONDS:-90}
      PRIVATE_DUEL_SECONDS: ${PRIVATE_DUEL_SECONDS:-600}
      READY_TIMEOUT_SECONDS: ${READY_TIMEOUT_SECONDS:-30}
      COUNTDOWN_SECONDS: ${COUNTDOWN_SECONDS:-3}
      REVEAL_SECONDS: ${REVEAL_SECONDS:-5}
      RECONNECT_GRACE_SECONDS: ${RECONNECT_GRACE_SECONDS:-30}
      QUESTION_HISTORY_BATTLES: ${QUESTION_HISTORY_BATTLES:-5}
      TZ: UTC
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
